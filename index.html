<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://www.youtube.com/game_api/v1"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sky Squad Run</title>



<style>
  
  
  :root {
    --night:#141238; --deep:#241f75; --blue:#3a5bff; --sky:#5fd3ff; --gold:#ffc93c; --coral:#ff4d6d; --mint:#35e8a5; --frost:#f2f6ff;
    --display:'Bungee','Arial Black',Impact,sans-serif; --body:'Rubik','Segoe UI',Arial,sans-serif;
    --chip:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; background:#000; touch-action:none; font-family:var(--body); font-weight:700; color:var(--frost); }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hide { display:none !important; }
  .ink { paint-order:stroke fill; -webkit-text-stroke:7px var(--night); text-shadow:0 5px 0 var(--night); }
  .chip { clip-path:var(--chip); background:var(--night); padding:7px 22px 9px; font-family:var(--display); font-size:17px; border-bottom:4px solid rgba(255,255,255,.18); }
  :focus-visible { outline:3px solid var(--gold); outline-offset:3px; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; top:0; left:0; right:0; padding:calc(10px + env(safe-area-inset-top)) 14px 0; pointer-events:none; z-index:10; }
  #hudRow { display:flex; justify-content:space-between; align-items:flex-start; }
  #hStage { color:var(--sky); max-width:62vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #hudRow > span:last-child { color:var(--gold); }
  #barWrap { margin:12px 14px 0 6px; height:10px; border-radius:6px; background:rgba(20,18,56,.6); }
  #bar { position:relative; height:100%; width:0; border-radius:6px; background:linear-gradient(90deg,var(--blue),var(--sky)); transition:width .15s; }
  #bar::after { content:'✈'; position:absolute; right:-13px; top:-12px; font-size:24px; filter:drop-shadow(0 2px 0 var(--night)); }
  #streakBox { position:fixed; top:calc(76px + env(safe-area-inset-top)); left:14px; padding:6px 20px 8px; clip-path:var(--chip); background:var(--gold); color:var(--night); font-family:var(--display); font-size:16px; pointer-events:none; z-index:10; border-bottom:4px solid #b78400; }
  #streakBox[data-tier="2"] { background:#ff9a3c; border-color:#b25a00; }
  #streakBox[data-tier="3"] { background:var(--coral); color:#fff; border-color:#a01834; animation:shiver .16s infinite; }
  @keyframes shiver { 50% { transform:translateX(3px) scale(1.05); } }
  #pow { position:fixed; transform:translate(-50%,-100%); padding:2px 16px 4px; border-radius:10px; border-bottom:4px solid rgba(0,0,0,.35); background:var(--blue); color:#fff; font-family:var(--display); font-size:24px; pointer-events:none; z-index:10; }
  #powerups { position:fixed; top:calc(76px + env(safe-area-inset-top)); right:14px; display:flex; gap:6px; z-index:10; pointer-events:none; }
  .puIcon { padding:5px 16px 7px; clip-path:var(--chip); font-family:var(--display); font-size:14px; background:var(--blue); border-bottom:4px solid rgba(0,0,0,.3); }
  .puIcon.shield { background:var(--blue); } .puIcon.magnet { background:var(--coral); }
  #hint { position:fixed; bottom:12%; left:0; right:0; text-align:center; font-family:var(--display); font-size:20px; pointer-events:none; z-index:10; animation:bob 1s ease-in-out infinite alternate; }
  @keyframes bob { to { transform:translateX(14px); } }

  /* ---------- Boss fight ---------- */
  #bossBar { position:fixed; top:calc(66px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); width:min(600px,92vw); z-index:10; pointer-events:none; animation:bossIn .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes bossIn { from { transform:translate(-50%,-90px) scale(.7); opacity:0; } }
  #bossLabel { display:inline-block; font-family:var(--display); font-size:16px; padding:5px 26px 3px 16px; clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%); background:var(--coral); color:#fff; }
  #bossBarWrap { position:relative; height:30px; border-radius:6px 14px 14px 14px; background:var(--night); overflow:hidden; border:4px solid var(--night); box-shadow:0 0 0 3px rgba(255,255,255,.2); }
  #bossBarWrap::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent calc(33.3% - 2px),var(--night) calc(33.3% - 2px) calc(33.3% + 2px),transparent calc(33.3% + 2px) calc(66.6% - 2px),var(--night) calc(66.6% - 2px) calc(66.6% + 2px),transparent calc(66.6% + 2px)); }
  #bossBarGhost { position:absolute; inset:0 auto 0 0; width:100%; background:#fff; }
  #bossBarFill { position:absolute; inset:0 auto 0 0; width:100%; background:linear-gradient(180deg,#ff8aa0,var(--coral) 55%,#c4264a); transition:width .08s; }
  #bossNum { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:15px; color:#fff; text-shadow:0 2px 0 var(--night); }
  #bossBar[data-phase="1"] #bossBarFill { background:linear-gradient(180deg,#ffe28a,var(--gold) 55%,#d49a00); }
  #bossBar[data-phase="2"] #bossBarFill { background:linear-gradient(180deg,#ff6b6b,#e0102a 55%,#8c0016); animation:throb .3s infinite alternate; }
  @keyframes throb { to { filter:brightness(1.6); } }
  #bossBar[data-phase="2"] { animation:bossIn .5s both, rattle .12s .5s infinite; }
  @keyframes rattle { 25% { margin-left:-3px; } 75% { margin-left:3px; } }
  #dmgLayer { position:fixed; inset:0; pointer-events:none; z-index:11; overflow:hidden; }
  .dmg { position:absolute; transform:translate(-50%,-50%); font-family:var(--display); font-size:26px; color:var(--gold); animation:dmgUp .8s ease-out forwards; paint-order:stroke fill; -webkit-text-stroke:6px var(--night); }
  .dmg.big { font-size:50px; color:#fff; }
  @keyframes dmgUp { 0% { transform:translate(-50%,-30%) scale(.4); opacity:0; } 15% { transform:translate(-50%,-60%) scale(1.3); opacity:1; } 100% { transform:translate(-50%,-260%) scale(.9); opacity:0; } }
  #banner { position:fixed; left:0; right:0; top:34%; text-align:center; font-family:var(--display); font-size:min(13vw,84px); color:var(--gold); pointer-events:none; z-index:22; opacity:0; paint-order:stroke fill; -webkit-text-stroke:10px var(--night); text-shadow:0 8px 0 var(--night); }
  #banner.warn::before { content:''; position:absolute; left:0; right:0; top:50%; height:84px; transform:translateY(-50%); z-index:-1; background:repeating-linear-gradient(-45deg,var(--coral) 0 22px,var(--night) 22px 44px); opacity:.9; }
  #banner.go { animation:banner 1.4s cubic-bezier(.2,1.5,.4,1) forwards; }
  @keyframes banner { 0% { transform:scale(3) rotate(-8deg); opacity:0; } 18% { transform:scale(1) rotate(-3deg); opacity:1; } 75% { transform:scale(1.06) rotate(-3deg); opacity:1; } 100% { transform:scale(1.3) rotate(-3deg); opacity:0; } }
  #vig { position:fixed; inset:0; pointer-events:none; z-index:12; opacity:0; box-shadow:inset 0 0 140px 40px var(--c,rgba(255,77,109,.7)); transition:opacity .3s; }

  /* ---------- Countdown & fade ---------- */
  #countdown { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20; pointer-events:none; }
  #countdown span { font-family:var(--display); font-size:min(34vw,200px); animation:countPop .45s cubic-bezier(.2,1.6,.4,1); paint-order:stroke fill; -webkit-text-stroke:12px var(--night); text-shadow:0 10px 0 var(--night); }
  @keyframes countPop { from { transform:scale(2.8) rotate(-10deg); opacity:0; } to { transform:scale(1) rotate(0); opacity:1; } }
  #fade { position:fixed; inset:0; background:var(--night); z-index:30; pointer-events:none; transition:opacity .4s; }

  /* ---------- Screens ---------- */
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; background:linear-gradient(180deg,rgba(20,18,56,.35),rgba(20,18,56,.92) 62%); padding:calc(20px + env(safe-area-inset-top)) 16px 28px; overflow-y:auto; z-index:25; }
  .screen h1 { font-family:var(--display); font-weight:400; font-size:min(14vw,72px); line-height:.95; text-align:center; color:var(--gold); transform:rotate(-3deg); margin:10px 0 6px; paint-order:stroke fill; -webkit-text-stroke:10px var(--night); text-shadow:0 8px 0 var(--coral), 0 14px 0 var(--night); }
  #menu h1 small { display:block; font-size:.42em; color:var(--sky); letter-spacing:14px; margin-top:10px; text-shadow:0 5px 0 var(--night); }
  .sub { font-size:15px; color:#c9d4ff; margin:14px 0 14px; text-align:center; }
  #menuTop { display:flex; gap:8px; margin-bottom:16px; }
  #coinsBox { color:var(--gold); } #statsBar { display:contents; } #statsBar span { color:var(--frost); }

  #grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; width:100%; max-width:420px; }
  .st { aspect-ratio:1; border:0; border-bottom:6px solid #1f35b8; border-radius:12px; background:var(--blue); color:#fff; font-family:var(--display); font-size:21px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:transform .08s; }
  .st:hover { transform:translateY(-2px); }
  .st small { font-family:var(--body); font-size:11px; color:var(--gold); height:12px; letter-spacing:1px; }
  .st.lock { background:#2b2a63; border-color:#1d1c47; color:#6e6cb0; cursor:default; }
  .st.lock:hover { transform:none; }
  .st.boss { background:var(--coral); border-color:#a01834; clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); border-radius:0; }
  .st.boss small { color:#fff; }

  #shopRow { display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; justify-content:center; max-width:460px; }
  .shopBtn { border:0; border-bottom:6px solid rgba(0,0,0,.35); border-radius:12px; padding:10px 14px; color:#fff; background:var(--c,var(--blue)); cursor:pointer; text-align:center; min-width:136px; font-family:var(--body); }
  .shopBtn:active { transform:translateY(4px); border-bottom-width:2px; }
  .shopBtn .label { font-family:var(--display); font-size:15px; font-weight:400; }
  .shopBtn .cost { font-size:12px; margin-top:4px; font-weight:700; }

  .btn { border:0; border-bottom:7px solid #1a9c6c; clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%); padding:13px 34px 10px; font-family:var(--display); font-size:20px; color:var(--night); background:var(--mint); margin-top:14px; min-width:250px; cursor:pointer; }
  .btn.alt { background:var(--gold); border-color:#b78400; } .btn.gray { background:var(--frost); border-color:#9aa6c9; }
  .btn:active { transform:translateY(5px); border-bottom-width:2px; }
  #sndBtn { min-width:0; font-size:14px; padding:9px 24px 7px; }

  #result { justify-content:center; }
  #result:not(.hide) #rTitle { animation:stamp .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes stamp { from { transform:scale(3) rotate(-14deg); opacity:0; } }
  #rStars { display:flex; gap:6px; margin:10px 0; font-size:64px; line-height:1; }
  #rStars i { font-style:normal; color:#3a3880; }
  #rStars i.on { color:var(--gold); text-shadow:0 5px 0 #b78400; animation:starPop .5s cubic-bezier(.2,1.8,.4,1) backwards; }
  @keyframes starPop { from { transform:scale(0) rotate(-90deg); } }
  #rInfo { font-size:18px; line-height:1.6; text-align:center; }
  #rRewards { margin-top:8px; font-size:16px; color:var(--gold); }
  .wTitle { grid-column:1/-1; font-family:var(--display); font-size:15px; color:var(--sky); margin-top:12px; display:flex; align-items:center; gap:10px; }
  .wTitle::after { content:''; flex:1; height:3px; background:rgba(95,211,255,.25); border-radius:2px; }
  .secT { font-family:var(--display); font-weight:400; font-size:16px; color:var(--gold); margin:26px 0 10px; text-align:center; }
  #skinRow { display:flex; gap:10px; overflow-x:auto; max-width:100%; padding:2px 4px 10px; touch-action:pan-x; }
  .skin { flex:0 0 auto; width:116px; border:0; border-bottom:6px solid rgba(0,0,0,.35); border-radius:12px; padding:12px 8px 10px; background:#2b2a63; color:var(--frost); font-family:var(--body); cursor:pointer; text-align:center; }
  .skin.on { background:var(--blue); outline:3px solid var(--gold); }
  .skin:active { transform:translateY(4px); border-bottom-width:2px; }
  .skin .ship { display:block; font-size:44px; line-height:1.1; transform:rotate(-45deg); -webkit-text-stroke:2px var(--w); }
  .skin .nm { font-family:var(--display); font-size:11px; margin-top:8px; }
  .skin .pr { font-size:12px; margin-top:3px; color:var(--gold); }
  #tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab { border:0; border-bottom:5px solid #1a1850; clip-path:var(--chip); background:#2b2a63; color:var(--frost); font-family:var(--display); font-size:14px; padding:10px 22px 8px; cursor:pointer; }
  .tab.on { background:var(--gold); color:var(--night); border-color:#b78400; }
  .panel { width:100%; display:flex; flex-direction:column; align-items:center; }
  .st.cur { outline:3px solid var(--gold); outline-offset:2px; }
  #skinRow { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; width:100%; max-width:420px; overflow:visible; touch-action:auto; }
  .skin { width:auto; padding:14px 8px 12px; }
  .skin svg { width:84px; height:94px; display:block; margin:0 auto; filter:drop-shadow(0 6px 8px rgba(0,0,0,.45)); }
  #loading { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; background:var(--night); font-family:var(--display); font-size:20px; color:var(--gold); }
  @media (prefers-reduced-motion:reduce) { #hint,#streakBox,#bossBar { animation:none !important; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">Loading…</div>

<div id="vig"></div>
<div id="dmgLayer"></div>
<div id="banner"></div>
<div id="fade" style="opacity:0"></div>
<div id="countdown" class="hide"><span id="cdText"></span></div>

<div id="hud" class="hide">
  <div id="hudRow"><span id="hStage" class="chip">Stage 1</span><span class="chip">🪙 <span id="hCoins">0</span></span></div>
  <div id="barWrap"><div id="bar"></div></div>
</div>
<div id="streakBox" class="hide" data-tier="1">🔥 x1</div>
<div id="pow" class="hide">10</div>
<div id="bossBar" class="hide" data-phase="0">
  <div id="bossLabel">👾 BOSS</div>
  <div id="bossBarWrap"><div id="bossBarGhost"></div><div id="bossBarFill"></div><div id="bossNum"></div></div>
</div>
<div id="powerups" class="hide"></div>
<div id="hint" class="hide ink">Swipe left-right, choose green gates</div>

<div id="menu" class="screen hide">
  <h1>SKY SQUAD<small>RUN</small></h1>
  <div class="sub">Assemble your squad, destroy the boss at the end.</div>
  <div id="menuTop">
    <div id="coinsBox" class="chip">🪙 <span id="coins">0</span></div>
    <div id="statsBar">
      <span class="chip">⭐ <span id="totalStars">0</span></span>
      <span class="chip">🏆 <span id="cleared">0</span></span>
    </div>
  </div>
  <div id="tabs"><button class="tab on" data-t="stages">Stage</button><button class="tab" data-t="hangar">Hangar</button><button class="tab" data-t="upgrade">Upgrade</button></div>
  <div id="pStages" class="panel"><div id="grid"></div></div>
  <div id="pUpgrade" class="panel hide">
  <div id="shopRow"></div></div>
  <div id="pHangar" class="panel hide">
  <div id="skinRow"></div></div>
  
</div>

<div id="result" class="screen hide">
  <h1 id="rTitle"></h1>
  <div id="rStars"></div>
  <div id="rInfo"></div>
  <div id="rRewards"></div>
  <button id="rNext" class="btn">Next Stage</button>
  <button id="rRetry" class="btn alt">Try Again</button>
  <button id="rMenu" class="btn gray">Menu</button>
</div>

<script src="js/three.min.js"></script>
<script src="js/levels.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
</body>
</html>
